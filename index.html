<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir Documento</title>
<style>
  body { font-family: Arial, sans-serif; color: #333; margin: 20px; }
  .header { display: flex; justify-content: space-between; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
  .title { font-size: 24px; font-weight: bold; color: #0056b3; }
  .info-box { margin-top: 20px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { background-color: #0056b3; color: white; padding: 10px; text-align: left; }
  td { border-bottom: 1px solid #ddd; padding: 8px; }
  .totals { width: 45%; float: right; margin-top: 20px; }
  .totals td { border: none; padding: 5px; }
  .total-final { font-weight: bold; font-size: 16px; background-color: #f2f2f2; }
  .footer { margin-top: 80px; text-align: center; font-size: 12px; color: #777; clear: both; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>

  <button class="no-print" onclick="window.print()" style="padding: 10px 20px; background: #0056b3; color: white; border: none; cursor: pointer; margin-bottom: 15px;">🖨️ Imprimir Documento</button>

  <div class="header">
    <div>
      <div class="title">Energy Cotiza y Factura</div>
      <p><strong><span id="tipo"></span> N°:</strong> <span id="numero"></span></p>
      <p><strong>Estado:</strong> <span id="estado"></span></p>
    </div>
    <div style="text-align: right;">
      <p><strong>Fecha Emisión:</strong> <span id="emision"></span></p>
      <p><strong>Fecha Vencimiento:</strong> <span id="vencimiento"></span></p>
      <p><strong>Cliente:</strong> <span id="cliente"></span></p> 
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Descripción / Servicio</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="tabla-detalles">
      <!-- Los detalles se llenan automáticamente -->
    </tbody>
  </table>

  <table class="totals">
    <tr>
      <td><strong>Subtotal:</strong></td>
      <td style="text-align: right;" id="subtotal"></td>
    </tr>
    <tr>
      <td><strong>Descuento:</strong></td>
      <td style="text-align: right;" id="descuento"></td>
    </tr>
    <tr>
      <td><strong>IVA Total:</strong></td>
      <td style="text-align: right;" id="iva"></td>
    </tr>
    <tr class="total-final">
      <td>Total Documento:</td>
      <td style="text-align: right;" id="total"></td>
    </tr>
    <tr>
      <td>Monto Pagado:</td>
      <td style="text-align: right;" id="pagado"></td>
    </tr>
    <tr>
      <td><strong>Saldo Pendiente:</strong></td>
      <td style="text-align: right;"><strong id="saldo"></strong></td>
    </tr>
  </table>

  <div class="info-box" style="clear: both; padding-top: 20px;">
    <p><strong>Método de Pago:</strong> <span id="metodo"></span></p>
    <p><strong>Notas:</strong> <span id="notas"></span></p>
  </div>

  <div class="footer">
    <img id="barcode" src="" alt="Código de barras" style="max-height: 60px;"><br>
    <p>Gracias por su preferencia.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const campos = ['tipo', 'numero', 'estado', 'emision', 'vencimiento', 'cliente', 'subtotal', 'descuento', 'iva', 'total', 'pagado', 'saldo', 'metodo', 'notas'];
    
    campos.forEach(campo => {
      if (params.has(campo)) {
        document.getElementById(campo).innerText = params.get(campo);
      }
    });

    if (params.has('barcode')) {
      document.getElementById('barcode').src = params.get('barcode');
    }

    // Cargar filas de detalles (separadas por | y columnas por ;)
    if (params.has('detalles')) {
      const tbody = document.getElementById('tabla-detalles');
      const filas = params.get('detalles').split('|');
      filas.forEach(fila => {
        if(fila.trim() !== "") {
          const cols = fila.split(';');
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${cols[0] || ''}</td><td>${cols[1] || ''}</td><td>${cols[2] || ''}</td><td>${cols[3] || ''}</td>`;
          tbody.appendChild(tr);
        }
      });
    }
  </script>
</body>
</html>
